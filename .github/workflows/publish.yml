name: Publish

# Publishes when a version tag is pushed, rather than on every push to a branch. A branch push is
# too easy to trigger by accident, and an npm publish cannot be undone.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Check can publish
        id: can_publish
        run: npx can-npm-publish --verbose
      - run: npm ci
      - name: Run unit test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish npm module
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: No Update
        if: failure() && steps.can_publish.outcome == 'failure'
        run: echo "No Update"
