name: Dependabot auto-merge

# Gives the repo hands-off dependency currency: safe Dependabot PRs enable auto-merge and land
# themselves once every required check (Lint, Test 18/20/22, Audit) is green. Auto-merge only
# *arms* the PR; branch protection still holds the gate, so a red check blocks the merge instead
# of letting it through.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Safe subset, gated only on Dependabot's *enumerated* outputs (update-type,
      # dependency-type) - never on package-ecosystem, whose value is not contract-stable:
      #   - any patch bump (lowest-risk semver change), and
      #   - dev-dependency minor bumps (build/test tooling, not shipped to consumers).
      # Everything else - runtime minors, ALL majors, GitHub Actions minors/majors - is left
      # for a human. A breaking runtime change cannot slip through on the frozen-fixture suite.
      - name: Enable auto-merge for safe updates
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           steps.meta.outputs.dependency-type == 'direct:development')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
