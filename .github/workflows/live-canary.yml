name: Live Canary

# The unit suite runs on frozen fixtures captured in 2022, so it cannot fail when YouTube changes
# what it actually serves. This job is the drift alarm: it exercises the real scrape + real
# get_live_chat endpoint against a real live stream, and opens an issue when that stops working.
#
# It has been verified to fail: breaking the INNERTUBE_API_KEY regex turns this job red.

on:
  schedule:
    # Daily at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      liveId:
        description: "Specific YouTube live video id to test against (optional)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Contract test against live YouTube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run live contract test
        id: live
        # Classify the result rather than letting `failure()` catch everything: the test exits
        # nonzero for INCONCLUSIVE (no live stream / no messages) too, and a bare `failure()` would
        # also fire on checkout/npm-ci faults. Only a genuine contract break should raise an alarm.
        # `continue-on-error` so this step never fails the job on its own - the classification does.
        continue-on-error: true
        env:
          YT_LIVE_ID: ${{ github.event.inputs.liveId }}
        # GitHub runners are datacenter IPs, which YouTube rate-limits more aggressively than
        # residential ones. Retry once so a single 429 does not raise a false alarm.
        run: |
          set +e
          out=$(npm run test:live 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            sleep 120
            out=$(npm run test:live 2>&1)
            code=$?
          fi
          echo "$out"
          if [ $code -eq 0 ]; then
            outcome=pass
          elif echo "$out" | grep -q "INCONCLUSIVE"; then
            outcome=inconclusive
          else
            outcome=contract_failure
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Open an issue when the contract genuinely breaks
        if: steps.live.outputs.outcome == 'contract_failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live canary failed - YouTube may have changed"
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "canary",
            })
            const body = [
              "The daily live contract test failed twice in a row.",
              "",
              "This usually means one of:",
              "- YouTube changed its watch page or `get_live_chat` response shape (needs a patch), or",
              "- the runner's datacenter IP got rate-limited (transient), or",
              "- no live stream was available to test against (inconclusive, not a real failure).",
              "",
              "The test output distinguishes these - a `ScrapeError` naming a specific field means a",
              "real page-shape change. `INCONCLUSIVE` means it never actually checked anything.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n")
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["canary"],
              })
            }

      # The contract test ran under continue-on-error, so fail the job explicitly on a real break
      # to make the run red. INCONCLUSIVE and infra faults leave the job green (no false alarm).
      - name: Fail the job on a genuine contract break
        if: steps.live.outputs.outcome == 'contract_failure'
        run: exit 1
